name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy
      - run: npm ci --prefix apps/frontend
      - run: npm --prefix apps/frontend run check
      - run: npm --prefix apps/frontend test
      - run: npm --prefix apps/frontend run build
      - run: node --check apps/frontend/src/api.mjs
      - run: python scripts/smoke_demo.py
